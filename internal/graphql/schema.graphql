scalar Time
scalar JSON

schema {
  query: Query
  mutation: Mutation
}

type Query {
  "Storage configuration and current row counts."
  config: Config!

  "Runtime info for the running otelop instance. Consumed by `otelop status`."
  status: Status!

  """
  List traces newest-first. from/to bound the query to a time range; both
  default to the full retention window (now - retention - 24h slack) .. (now + 24h slack).
  search, if given, case-insensitively matches a trace whose trace ID, or any
  span's name, status code, or resource service name, contains it (substring
  match; % and _ are treated literally, not as wildcards). An empty/omitted
  search matches every trace in range. `total` reflects the search-narrowed
  count.
  """
  traces(limit: Int = 50, offset: Int = 0, from: Time, to: Time, search: String): TraceConnection!

  "Fetch a single trace by its hex-encoded trace ID."
  trace(traceId: ID!): Trace

  """
  List metrics newest-first. from/to bound the query to a time range; both
  default to the full retention window.
  """
  metrics(limit: Int = 50, offset: Int = 0, from: Time, to: Time): MetricConnection!

  """
  List log records newest-first. If traceId is given, only logs whose TraceID
  matches are returned — the standard observability trace↔log correlation —
  and from/to and search are ignored (matching the trace's own retained
  lifetime). Otherwise from/to bound the query to a time range, defaulting to
  the full retention window, and search, if given, case-insensitively matches
  a log whose body, resource service name, severity text, or trace ID
  contains it (substring match; % and _ are treated literally, not as
  wildcards). An empty/omitted search matches every log in range. `total`
  reflects the search-narrowed count.
  """
  logs(limit: Int = 50, offset: Int = 0, traceId: String, from: Time, to: Time, search: String): LogConnection!

  """
  Facet-aggregated series for one (serviceName, name) metric: every
  attribute-series is delta/cumulative-derived first (the same derivation
  `metrics.dataPoints` uses), THEN summed within each distinct combination of
  groupBy attribute values and bucketed into bucketSeconds-wide time windows —
  the server-side fix for a chart line that would otherwise zigzag between
  multiple raw series sharing a facet value. from/to default to the full
  retention window, matching the other list queries. bucketSeconds is
  optional: omitted or null auto-sizes the bucket to target ~150 buckets
  across the metric's actual data extent within from/to, rather than the
  from/to window itself — the fix for a short-lived metric queried over a
  wide/unbounded window collapsing into a handful of giant buckets.
  """
  metricAggregate(serviceName: String!, name: String!, groupBy: [String!]!, bucketSeconds: Int, from: Time, to: Time): [AggregateSeries!]!
}

type Mutation {
  "Drop every buffered trace, metric, and log."
  clearSignals: Boolean!
}

type Config {
  "Database file path, or empty for an in-memory database (tests only)."
  storagePath: String!
  "Configured retention window, as given in the TOML/CLI/env config (e.g. \"7d\")."
  retention: String!
  "Configured on-disk size ceiling, as given in the TOML/CLI/env config (e.g. \"4GB\")."
  maxSize: String!
  traceCount: Int!
  metricCount: Int!
  logCount: Int!
}

type Status {
  version: String!
  "Server start time (RFC3339)."
  startedAt: Time!
  "Milliseconds since the server started."
  uptimeMs: Float!
  "HTTP / Web UI listen address as passed on the command line."
  httpAddr: String!
  "OTLP gRPC receiver listen address."
  otlpGrpcAddr: String!
  "OTLP HTTP receiver listen address."
  otlpHttpAddr: String!
  "Upstream OTLP forwarding target, or empty when forwarding is disabled."
  proxyUrl: String!
  "Upstream OTLP forwarding protocol (`grpc` or `http`), or empty when disabled."
  proxyProtocol: String!
  "True when self-telemetry is enabled via --debug."
  debug: Boolean!
  "Configured log level (e.g. \"warn\"), as given in the TOML/CLI/env config."
  logLevel: String!
  "Storage configuration and current row counts."
  config: Config!
  "Current database file size in bytes (0 for an in-memory database)."
  dbSizeBytes: Float!
}

type TraceConnection {
  items: [Trace!]!
  total: Int!
  limit: Int!
  offset: Int!
}

type MetricConnection {
  items: [Metric!]!
  total: Int!
  limit: Int!
  offset: Int!
}

type LogConnection {
  items: [Log!]!
  total: Int!
  limit: Int!
  offset: Int!
}

type Trace {
  traceId: ID!
  serviceName: String!
  rootSpan: Span
  "Every span otelop has buffered under this trace."
  spans: [Span!]!
  spanCount: Int!
  startTime: Time!
  "Total trace duration in milliseconds."
  durationMs: Float!
  "True if any span under the trace has StatusCode='Error'."
  hasError: Boolean!
  "Log records whose TraceID matches this trace — correlation join."
  logs: [Log!]!
}

type Span {
  traceId: ID!
  spanId: ID!
  parentSpanId: String!
  name: String!
  kind: String!
  serviceName: String!
  startTime: Time!
  endTime: Time!
  "Span duration in milliseconds."
  durationMs: Float!
  statusCode: String!
  statusMessage: String!
  attributes: JSON!
  events: [SpanEvent!]!
  resource: JSON!
  "Parent trace. Always present because spans are only returned via a trace."
  trace: Trace!
  "Parent span within the same trace, if any. Null for root spans."
  parent: Span
}

type SpanEvent {
  name: String!
  timestamp: Time!
  attributes: JSON!
}

type Metric {
  name: String!
  description: String!
  unit: String!
  type: String!
  serviceName: String!
  resource: JSON!
  dataPoints: [DataPoint!]!
  "Length of dataPoints without requesting the array."
  pointCount: Int!
  receivedAt: Time!
}

"""
One point in a metric's series. The primary fields describe per-interval
activity: for cumulative OTLP inputs (monotonic Sum, Histogram, Summary,
ExponentialHistogram) the server delta-izes against the previous observation
before returning; delta inputs are already per-interval. The `cumulative`
family carries the running total "since otelop started observing this series"
so clients can show session totals without re-summing the delta column — for
cumulative-temporality input it's the exporter's raw cumulative, for
delta-temporality input otelop accumulates the deltas itself. Note that otelop
is a local in-memory viewer: the running total resets when the daemon restarts.
"""
type DataPoint {
  "Stable, globally unique identity (UUIDv7) assigned at ingestion. Survives ring-buffer eviction and reconnects, so clients can use it as a durable key."
  id: ID!
  timestamp: Time!
  """
  The primary scalar for this point. Gauge: instantaneous value. Sum: per-window
  delta. Histogram / Summary / ExponentialHistogram: per-window arithmetic mean
  (sum / count) so the metric's declared unit applies directly.
  """
  value: Float!
  """
  Running total for this series since otelop started observing it. For
  cumulative temporality it's the exporter's raw cumulative; for delta
  temporality otelop sums the deltas itself. Populated for monotonic Sum;
  null for Gauge, non-monotonic Sum, and distribution metrics.
  """
  cumulative: Float
  "Delta observation count for distribution metrics. Null for Gauge/Sum."
  count: Float
  """
  Running total observation count since otelop started observing this series.
  For cumulative Histogram / Summary / ExponentialHistogram it's the
  exporter's raw cumulative; for delta temporality otelop sums the deltas
  itself. Null for Gauge and Sum.
  """
  countCumulative: Float
  "Delta of observation sums for distribution metrics. Null for Gauge/Sum."
  sum: Float
  """
  Running total of observation sums since otelop started observing this
  series, for distributions that report a sum. Raw cumulative for cumulative
  temporality; accumulated by otelop for delta temporality. Null otherwise.
  """
  sumCumulative: Float
  "Minimum observation in this window, as reported by the SDK. Null when unavailable."
  min: Float
  "Maximum observation in this window, as reported by the SDK. Null when unavailable."
  max: Float
  attributes: JSON!
}

"""
One facet group's fully bucketed series from the metricAggregate query — one
line on the chart when a facet is active. groupValues is ordered to match the
groupBy argument (e.g. groupBy: ["region"] → groupValues: ["us-east"]); a
series missing that attribute contributes to the "" (empty string) value.
"""
type AggregateSeries {
  groupValues: [String!]!
  points: [AggregatePoint!]!
}

"""
One time bucket of an AggregateSeries — the summed-across-series counterpart
to DataPoint. Unlike DataPoint there is no `cumulative` family: a running
total only makes sense per series, not summed across a facet group over time.
"""
type AggregatePoint {
  timestamp: Time!
  """
  Gauge/Sum: summed per-window delta across every series in the group.
  Histogram/Summary/ExponentialHistogram: summed-sum / summed-count (0 when
  the summed count is 0), so the metric's declared unit still applies
  directly.
  """
  value: Float!
  "Summed per-window observation count for distribution metrics. Null for Gauge/Sum."
  count: Float
  "Summed per-window observation sum for distribution metrics. Null for Gauge/Sum."
  sum: Float
  "Minimum observation across every contributing series in this window. Null when unavailable."
  min: Float
  "Maximum observation across every contributing series in this window. Null when unavailable."
  max: Float
}

type Log {
  "Stable, globally unique identity (UUIDv7) assigned at ingestion. Survives ring-buffer eviction and reconnects, so clients can use it as a durable key."
  id: ID!
  timestamp: Time!
  observedTimestamp: Time!
  traceId: String!
  spanId: String!
  severityNumber: Int!
  severityText: String!
  body: String!
  serviceName: String!
  attributes: JSON!
  resource: JSON!
  "Correlated trace, or null if the log has no traceId or the trace has been evicted from the ring buffer."
  trace: Trace
  "Correlated span within the trace, or null if traceId/spanId are unset or the trace/span is missing."
  span: Span
}
