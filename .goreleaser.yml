version: 2

before:
  hooks:
    - mise run build-frontend

# CGO (required by the DuckDB storage driver, see
# docs/design/duckdb-storage.md "Build and release impact") rules out
# building every (goos, goarch) target from one goreleaser invocation the
# way the old CGO_ENABLED=0 pure cross-compile did: linux targets need a
# native (or at least same-OS) C toolchain, which a single runner doesn't
# have for every OS. goreleaser's own answer to that (Pro-only split/merge,
# or the Pro-only "prebuilt" builder) isn't available on the free tier.
#
# So this config is no longer what cuts an actual release — it's kept for
# local use only (`mise run release-snapshot`, invoked with
# --single-target so it only builds for the host's own goos/goarch, which
# always has a matching native toolchain) and for `goreleaser check` in CI.
# The real multi-platform release is .github/workflows/release.yml: a
# go-build matrix across ubuntu-latest/ubuntu-24.04-arm/macos-latest,
# assembled by scripts/package-release.sh and published with `gh release
# upload` + `docker buildx`, bypassing goreleaser entirely.
builds:
  - main: ./cmd/otelop
    flags:
      - -tags=embed
    env:
      - CGO_ENABLED=1
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: darwin
        formats:
          - zip

changelog:
  disable: true

release:
  mode: keep-existing
