name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  ci:
    runs-on: ubuntu-24.04
    # The DuckDB storage driver requires CGO (docs/design/duckdb-storage.md
    # "Build and release impact"). Ubuntu 24.04 ships a C toolchain so this
    # is already the default, but pin it explicitly so a future runner image
    # change can't silently flip it off and make `go test`/`go vet`/lint fail
    # to see cgo-gated code paths.
    env:
      CGO_ENABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      - run: mise run install
      - run: mise run codegen-check
      - run: mise run check
      - run: mise run test
      - run: mise run build
