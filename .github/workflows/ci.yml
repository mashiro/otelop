name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  ci:
    runs-on: ubuntu-26.04
    # The DuckDB storage driver requires CGO (docs/design/duckdb-storage.md
    # "Build and release impact"). Ubuntu ships a C toolchain so this
    # is already the default, but pin it explicitly so a future runner image
    # change can't silently flip it off and make `go test`/`go vet`/lint fail
    # to see cgo-gated code paths.
    env:
      CGO_ENABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      - run: mise run install
      - run: mise run codegen-check
      - run: mise run check
      - run: mise run test
      - run: mise run build
